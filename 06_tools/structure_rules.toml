# 저장소 구조 규칙 — 기계가 읽는 정본.
#
# 사람이 읽는 정본은 루트 STRUCTURE.md 다. 두 문서가 어긋나면 check_structure.py 의 D1 이 잡는다.
# 이 파일을 읽는 것: 06_tools/python/check_structure.py (전체 검사, classify_new_path)
#                    .claude/hooks/placement_guard.py (새 파일 배치 차단, classify_new_path 경유)
#
# 규칙을 바꾸는 순서: 이 파일과 STRUCTURE.md 를 같은 커밋에서 고친다(메인 에이전트, 사용자 확인).
# 경로는 모두 저장소 루트 기준, 구분자는 '/'.
# 글롭: '*' 는 경로 성분 하나 안에서만, '**' 는 성분 여러 개에 걸쳐 일치한다.

# ─────────────────────────────────────────────────────────────────────────────
# §1 최상위 대역
# ─────────────────────────────────────────────────────────────────────────────
[top_level]
# git 이 추적하는 최상위 항목. 이 밖의 추적 항목은 T1 오류.
tracked = [
  "01_src", "02_shaders", "05_tests", "06_tools", "07_results", "08_learn",
  "09_diagrams", "10_paper", "cmake", ".claude",
  "CLAUDE.md", "README.md", "STRUCTURE.md", "CMakeLists.txt",
  "environment.yml", ".gitignore", ".mcp.json",
]
# 디스크에만 있고 추적하지 않는 최상위 항목. 이 밖의 미추적 항목은 T1 경고.
untracked = ["03_models", "04_data", "11_logs", "build", "build-asan", ".git"]
# .gitignore 의 /build*/ 와 같은 뜻 (build-display/ 같은 병렬 빌드 폴더)
untracked_globs = ["build*"]

[junk]
# T2: 루트에 떨어진 런타임 로그 잔재. 보관할 로그는 11_logs/<날짜>_… 또는 07_results/<실험>/raw/_session/
root_logs = ["hailort.log", "pyhailort.log"]
# T2: 어디에도 추적되면 안 되는 덤프 (파일 이름 글롭)
dump_globs = ["*.data", "perf.data*", "core", "vgcore.*"]

# ─────────────────────────────────────────────────────────────────────────────
# §2 코드 대역 (재배치 후 목표 레이아웃)
# ─────────────────────────────────────────────────────────────────────────────
[code]
src_root = "01_src"
# 01_src 바로 아래 허용 폴더 (C1)
allowed_dirs = ["core", "ref", "toolkit", "testkit", "decode", "hailo", "vulkan",
                "display", "isp", "pipeline", "gstelem", "tools"]
# 01_src 바로 아래 허용 파일
root_files = ["CMakeLists.txt"]
# 라이브러리 폴더: toolkit/testkit/tools include 금지(DAG 로 표현됨),
# YVO_REPO_ROOT·YVO_DEFAULT_* 사용 금지(C7). library_exclude 의 파일은 실행파일 본체라 뺀다.
library_dirs = ["core", "ref", "decode", "hailo", "vulkan", "display", "isp", "pipeline", "gstelem"]
library_exclude = ["01_src/pipeline/main.cpp"]
# 라이브러리 폴더 안에 두면 안 되는 하위 폴더 (C1) — 도구는 01_src/tools/<도메인>/
library_forbidden_subdirs = ["tools"]
# main() 허용 위치 (C5). tools 는 파일당 1개.
main_allowed = ["01_src/tools/**/*.cpp", "01_src/pipeline/main.cpp"]
# C2: 폴더 이름이 이 디렉터리들의 하위 폴더 이름과 겹치면 안 된다
#     (예: libpisp 의 common/ 과 겹치면 "common/utils.hpp" 가 어느 쪽인지 모호해진다)
system_include_roots = ["/usr/include", "/usr/include/libpisp"]
system_name_ok = ["hailo", "vulkan"]   # 시스템 폴더와 같은 이름이지만 의도된 것 (hailo/hailort.hpp, vulkan/vulkan.h 는 <> 로만 쓴다)
source_exts = [".cpp", ".hpp", ".h", ".c", ".cc"]
# 05_tests 에 둘 수 있는 것
tests_dir = "05_tests"

# 따옴표 include 계층 DAG (C4). 첫 경로 성분으로 판정. 자기 폴더는 항상 허용. "*" = 전부.
# 라이브러리 폴더(core·ref·decode·hailo·vulkan·display·isp·pipeline)가
# toolkit/testkit/tools 를 include 하지 않는 것도 이 표가 강제한다.
[code.include_deps]
core      = []
ref       = ["core"]
toolkit   = ["core", "ref"]
decode    = ["core"]
hailo     = ["core", "ref"]
vulkan    = ["core", "ref"]
display   = ["core", "ref", "vulkan"]
isp       = ["core", "ref"]
testkit   = ["core", "ref", "vulkan", "display", "testkit"]
pipeline  = ["core", "ref", "hailo", "vulkan", "display", "decode"]
gstelem   = ["core", "ref", "hailo", "vulkan"]
tools     = ["*"]
"05_tests" = ["core", "ref", "toolkit", "testkit", "decode", "hailo", "vulkan",
              "display", "isp", "pipeline", "gstelem"]

[code.include_unprefixed]
# 접두사 없이 써도 되는 include (빌드 산출물·외부 라이브러리)
globs = ["*_spv.h", "xdg-shell-client-protocol.h"]

# 파일별 예외: libpisp 헤더는 libpisp 의 include 루트 기준 경로라 첫 성분이 우리 계층이 아니다.
[[code.include_file_exception]]
file = "01_src/isp/isp_resizer.cpp"
includes = [
  "backend/backend.hpp",
  "common/logging.hpp",
  "common/utils.hpp",
  "helpers/backend_device.hpp",
  "helpers/media_device.hpp",
  "variants/variant.hpp",
]
reason = "libpisp 공개 헤더. pkg-config libpisp 의 include 루트 기준 경로다"

# C1 제안 문구 (옛 폴더 → 새 위치)
[code.suggest]
common = "01_src/core/ · 01_src/ref/ · 01_src/toolkit/ 중 하나 (STRUCTURE.md §2)"
tools = "01_src/tools/<도메인>/"

[cmake]
# C8: cmake/ 밖 CMakeLists.txt 에 쓰면 안 되는 토큰 (주석 제외)
forbidden_outside_cmake_dir = ["-mcpu", "${OpenCV_LIBS}"]
# C8: 어느 CMake 파일에도 쓰면 안 되는 토큰
forbidden_anywhere = ["yvo_add_subdirectory_if_exists"]

[bench]
dir = "06_tools/bench"
forbidden = ["build/01_src"]          # C9: 바이너리는 $BIN_DIR(build/bin) 에서 찾는다
py_hailo_owner = "06_tools/bench/lib/common.sh"   # C9: PY_HAILO= 정의는 여기서만
npu_guard = ".claude/hooks/npu_guard.py"          # C10: BENCH_SCRIPTS 가 있으면 bench/*.sh 와 같아야 한다

[docs]
structure_md = "STRUCTURE.md"         # D1: "최상위" 헤딩 아래 첫 표의 첫 열 백틱 항목 == top_level

# ─────────────────────────────────────────────────────────────────────────────
# 새 파일 배치 (classify_new_path). 가장 긴 prefix 가 이긴다. allow 는 prefix 뒤 나머지 경로에 대한 글롭.
# 01_src·07_results 는 위/아래 전용 규칙으로 판정하고, 03_models·04_data·11_logs·build* 는 검사하지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
[[placement]]
prefix = "02_shaders/"
allow = ["*.comp", "*.glsl", "diag/*.comp", "diag/*.glsl", "CMakeLists.txt", "README.md"]
hint = "셰이더는 02_shaders/ (진단용은 02_shaders/diag/), CMakeLists.txt 에 등록"

[[placement]]
prefix = "05_tests/"
allow = ["**/*.cpp", "**/*.hpp", "**/*.h", "**/CMakeLists.txt", "README.md"]
hint = "테스트 소스·CMakeLists 만. 픽스처 데이터는 04_data/"

[[placement]]
prefix = "06_tools/"
allow = ["README.md", "structure_rules.toml"]
hint = "06_tools/{bench,python,probes}/ 중 하나"

[[placement]]
prefix = "06_tools/bench/"
allow = ["*.sh", "lib/*.sh"]
hint = "벤치 셸은 06_tools/bench/*.sh, 공통 함수는 06_tools/bench/lib/*.sh. 추가·삭제 시 npu_guard 목록과 동기화"

[[placement]]
prefix = "06_tools/python/"
allow = ["**/*.py"]
hint = "06_tools/python/ 에는 .py 만. 문서는 06_tools/README.md"

[[placement]]
prefix = "06_tools/probes/"
allow = ["*.c", "*.cpp", "*.h", "*.hpp", "*.py", "*.sh"]
hint = "일회성 프로브 소스만"

[[placement]]
prefix = "08_learn/"
allow = ["*.md", "assets/**"]
hint = "교재는 08_learn/NN_이름.md"

[[placement]]
prefix = "09_diagrams/"
allow = ["*.graphml", "README.md", "*.png", "*.svg"]
hint = "yEd .graphml 은 09_diagrams/ 바로 아래"

[[placement]]
prefix = "10_paper/"
allow = ["*.md", "figures/README.md", "figures/fig*.svg", "figures/fig*.png"]
hint = "논문 본문은 10_paper/*.md, 그림은 10_paper/figures/figNN_<slug>.{svg,png} (06_tools/python/paper/ 스크립트로 생성)"

[[placement]]
prefix = "cmake/"
allow = ["*.cmake"]
hint = "CMake 모듈만(*.cmake)"

[[placement]]
prefix = ".claude/"
allow = ["**"]

# 루트에 새 파일을 만들려 할 때 확장자별 제안
[placement_root_suggest]
".md" = "08_learn/ (교재) 또는 해당 폴더의 README.md"
".log" = "11_logs/<날짜>_<이름>.log 또는 07_results/<실험>/raw/_session/"
".py" = "06_tools/python/"
".sh" = "06_tools/bench/"
".cpp" = "01_src/<계층>/ 또는 01_src/tools/<도메인>/"
".hpp" = "01_src/<계층>/"
".comp" = "02_shaders/"
".csv" = "07_results/<실험>/"
".txt" = "07_results/<실험>/ 또는 11_logs/"
".png" = "07_results/<실험>/samples/"
".graphml" = "09_diagrams/"

# ─────────────────────────────────────────────────────────────────────────────
# §3 07_results 레이아웃
# ─────────────────────────────────────────────────────────────────────────────
[results]
root = "07_results"
index = "07_results/README.md"
root_files = ["README.md", "duplicate_png.md"]          # R2
required = ["summary.md", "env_bench.txt"]              # R3 (실험 폴더)
run_required = ["env_bench.txt"]                        # R3 (runs/<회차>/ — summary.md 는 선택)
files = ["summary.md", "env_bench.txt", "REPORT.md", "results.csv",
         "results_raw.csv", "results_raw_*.csv"]        # R4
dirs = ["raw", "evidence", "verification", "samples", "notes", "env", "runs"]   # R4
run_dir_re = '^[A-Za-z0-9][A-Za-z0-9_.-]*_run\d+$'      # R6
session_dir = "_session"                                # R6·R7
session_files = ["hailort.log", "bench_stdout.log"]     # R7
notes_globs = ["*.md", "**/*.md"]                       # R9
evidence_warn_globs = ["asan_*", "validation_*", "ctest*"]   # R9 경고: verification/ 에 둘 것
# R5: 색인 표 "유형" 열 값 → 필수 항목 (끝이 '/' 면 폴더)
[results.type_required]
"스윕" = ["results.csv", "results_raw.csv", "raw/"]
"프로브" = ["evidence/"]
"레거시" = []

# R4 제안: 허용 밖 폴더 이름 글롭 → 옮길 곳 (STRUCTURE.md §6 이동표와 같은 방향)
[results.suggest_dirs]
"detections" = "samples/detections/ (비교 결과 compare_* 는 evidence/)"
"dump_*" = "samples/"
"preproc" = "samples/"
"selftest" = "evidence/"
"pipeline*" = "runs/<회차>/"
"latency_*" = "runs/<회차>/"
"gen*" = "runs/<회차>/"
"m5a*" = "raw/m5a_run1/"

# ─────────────────────────────────────────────────────────────────────────────
# §5 예외. reason 필수. 한 번도 쓰이지 않은 예외는 E1 경고.
# waive 토큰: summary · env_bench (R3) / layout (R4·R6·R7·R8) / sweep_csv (R4 의 *.csv) /
#             type (R5) / notes · evidence_names (R9) / 또는 규칙 ID 그대로(R4 등)
# path 는 그 경로와 모든 하위에 적용된다. 성분 글롭('*') 허용.
# 07_results 는 이동(STRUCTURE.md §6) 뒤의 레이아웃을 기준으로 적었다.
# ─────────────────────────────────────────────────────────────────────────────
[[exception]]
path = "07_results/npu_benchmark"
waive = ["env_bench"]
reason = "env_bench.txt 규약(2026-09) 이전의 레거시 측정. 환경은 runs/*/device_info.txt·thermal_*.txt 에 흩어져 있고 소급 생성하지 않는다"

[[exception]]
path = "07_results/npu_benchmark/runs/*"
waive = ["env_bench", "layout"]
reason = "hailortcli benchmark 출력이 회차 폴더에 평면으로 놓인 레거시 레이아웃(benchmark_b*.csv/txt, thermal_*.txt, hailort.log). 파일 내용·이름을 바꾸지 않는 원칙이라 raw/ 로 재구성하지 않는다"

[[exception]]
path = "07_results/display_vulkan_hdmi"
waive = ["env_bench"]
reason = "프로브형 실험(P4~P10). 처리량 측정이 아니라 동작 가부를 가른 것이라 벤치 환경 기록을 남기지 않았다"

[[exception]]
path = "07_results/gpu_postprocess"
waive = ["env_bench"]
reason = "프로브형 실험(P1~P3, F0). 벤치 스크립트 없이 도구를 직접 돌렸고 환경은 evidence/*.txt 머리에 있다"

[[exception]]
path = "07_results/op_point/runs/latency_gen3_cooled"
waive = ["env_bench", "sweep_csv"]
reason = "냉각 Gen3 지연 재측정. env_bench.txt 없이 hailortcli 로 쟀고, 집계가 benchmark_raw.csv·overall_latency_raw.csv 두 파일로 나뉘어 results_raw.csv 규약 이전 이름이다"

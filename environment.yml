name: hailo-yolo
channels:
  - conda-forge
dependencies:
  - pip
  - python=3.13
  - numpy=2.5    # paper figures (06_tools/python/paper/), required by hailort
  - pip:
      # paper figures (06_tools/python/paper/); installed from PyPI in the live env
      - matplotlib==3.11.*
      # HailoRT wheel (manual download from Hailo Developer Zone; must match runtime libhailort 4.24.0)
      # used by hailo_temp() in 06_tools/bench/lib/common.sh
      - /home/pi/Downloads/hailort-4.24.0-cp313-cp313-linux_aarch64.whl
